# hyprlock - Tokyo Night

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# Contraseña y huella en paralelo.
# La huella la lee hyprlock directamente (sobrevive a la suspension y permite reintentar).
# La contraseña usa el servicio PAM "password-auth", que en Fedora no incluye la huella: el
# servicio por defecto ("hyprlock" -> "login") si la incluye y los dos competirian por el lector.
auth {
    pam {
        module = password-auth
    }

    fingerprint {
        enabled = true
        ready_message = Toca el lector de huella o escribe tu contraseña
        present_message = Leyendo huella...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 2
    brightness = 0.7
}

# HORA
label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 96
    font_family = $font ExtraBold

    position = 0, 160
    halign = center
    valign = center
}

# FECHA
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_MX.UTF-8 date +"%A, %d de %B"
    color = rgb(7aa2f7)
    font_size = 22
    font_family = $font

    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 14

    inner_color = rgba(1a1b26cc)
    outer_color = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    check_color = rgba(e0af68ee)
    fail_color = rgba(f7768eee)
    font_color = rgb(c0caf5)

    fade_on_empty = false
    font_family = $font
    placeholder_text = Contraseña...
    fail_text = No coincide, inténtalo de nuevo ($ATTEMPTS)
    dots_spacing = 0.3

    position = 0, -60
    halign = center
    valign = center
}

# AYUDA con lector de huella: estado del lector (listo / leyendo). Vacio si no hay lector
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(a9b1d6)
    font_size = 12
    font_family = $font

    position = 0, -115
    halign = center
    valign = center
}

# AYUDA sin lector de huella (scripts/lock-hint.sh no escribe nada si lo hay)
label {
    monitor =
    text = cmd[update:0] ~/.config/hypr/scripts/lock-hint.sh
    color = rgb(a9b1d6)
    font_size = 12
    font_family = $font

    position = 0, -115
    halign = center
    valign = center
}

# DISTRIBUCION DE TECLADO
label {
    monitor =
    text = $LAYOUT[us,latam]
    color = rgb(565f89)
    font_size = 12
    font_family = $font

    position = 0, -145
    halign = center
    valign = center
}
