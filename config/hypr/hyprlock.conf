# hyprlock - Tokyo Night

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 2
    brightness = 0.7
}

# HORA
label {
    monitor =
    text = $TIME
    color = rgb(c0caf5)
    font_size = 96
    font_family = $font ExtraBold

    position = 0, 160
    halign = center
    valign = center
}

# FECHA
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgb(7aa2f7)
    font_size = 22
    font_family = $font

    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 14

    inner_color = rgba(1a1b26cc)
    outer_color = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    check_color = rgba(e0af68ee)
    fail_color = rgba(f7768eee)
    font_color = rgb(c0caf5)

    fade_on_empty = false
    font_family = $font
    placeholder_text = Contraseña...
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -60
    halign = center
    valign = center
}

# DISTRIBUCION DE TECLADO
label {
    monitor =
    text = $LAYOUT[us,latam]
    color = rgb(565f89)
    font_size = 12
    font_family = $font

    position = 0, -130
    halign = center
    valign = center
}
