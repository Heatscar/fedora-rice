# Luz nocturna siempre activa. Super + N la alterna a mano.
# Intensidad: temperatura en kelvin; mas baja = mas calida. 6500 es neutra, 4000 suave, 3000 intensa.
# Si la cambias, cambia tambien "warm" en scripts/nightlight.sh, que es la que usa Super + N.
# Para un horario, añade mas bloques "profile" con otra hora; "identity = true" es el tono normal.

profile {
    time = 0:00
    temperature = 3500
}
