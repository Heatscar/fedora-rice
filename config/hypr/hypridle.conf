general {
    # Sin animacion de entrada: el fundido de hyprlock parte de una captura del escritorio, y si
    # el equipo se duerme a mitad, al despertar se veria esa captura un instante.
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in
    before_sleep_cmd = loginctl lock-session                          # lock before suspend.
    inhibit_sleep = 3                                                 # no dormir hasta que la sesion este bloqueada.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn on screen w/o key press after resume.
}

listener {
    timeout = 300                                # 5min.
    on-timeout = brightnessctl -s set 10%        # atenuar la pantalla.
    on-resume = brightnessctl -r                 # restaurar brillo.
}

listener {
    timeout = 600                                 # 10min.
    on-timeout = loginctl lock-session            # bloquear.
}

listener {
    timeout = 660                                                 # 11min.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # apagar pantalla.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # encender al detectar actividad.
}

listener {
    timeout = 1800                                # 30min.
    on-timeout = systemctl suspend                # suspender.
}
